<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundae Social Post Template</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#F4DDD6;--ink:#2A1710;--accent:#B3202F}
*{box-sizing:border-box}
body{margin:0;background:#E9E6E3;font-family:'Inter Tight',system-ui,sans-serif;color:#222}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:12px 16px;background:#fff;border-bottom:1px solid #ddd;font-size:14px}
.bar button{font:inherit;font-weight:600;background:#2A1710;color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.bar label{display:flex;align-items:center;gap:6px}
.bar input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;cursor:pointer}
.hint{color:#555}
#wrap{display:flex;justify-content:center;padding:24px 0}
#holder{width:1080px;height:1350px;transform-origin:top center}
#post{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ground);color:var(--ink)}
#post [contenteditable]{outline:none}
#post [contenteditable]:hover{outline:2px dashed rgba(0,0,0,.25);outline-offset:6px}
.abs{position:absolute}
#img{position:absolute;left:40px;top:420px;width:1000px;height:auto;mix-blend-mode:multiply;cursor:pointer}
</style>
</head>
